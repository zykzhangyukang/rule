proxy-providers:
  Airport1:
    url: "机场订阅填到这里，两端引号不要去掉，不要填写到下方链接里去！！"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct, udp: true}

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true


external-controller: 0.0.0.0:9090
secret: "123456"
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"


# 时间同步（时间偏差会导致 TLS/节点握手失败）
ntp:
  enable: true
  write-to-system: true

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - cn_ip

# 域名嗅探：应用直连 IP / 绕过系统 DNS 时，仍能还原域名参与分流
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-ttl: 1
  fake-ip-filter-mode: blacklist
  # 仅用于解析下面各个 DoH/DoT 地址里的域名，必须是 IP 形式或能直接解析的地址
  default-nameserver:
    - https://223.5.5.5/dns-query
  # 仅用于解析代理节点自身的域名（订阅里的 server 地址），走直连，避免"先有鸡还是先有蛋"
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 节点域名的分流解析：这些域名解析节点地址时改用指定 DNS
  proxy-server-nameserver-policy:
    "+.dongchedi.com":
      - https://tshf1.flashdoh.com:2096/dns-query/秘钥#skip-cert-verify=true
    # 大哥云
    "+.bilibilll.com":
      - https://doh.lalakw.com:2096/dns-query/e9444f3c
      - https://doh.luluky.com/dns-query/e9444f3c
    "+.aixifan256.com":
      - https://doh.lalakw.com:2096/dns-query/e9444f3c
      - https://doh.luluky.com/dns-query/e9444f3c
    "+.quandao.com":
      - https://doh.lalakw.com:2096/dns-query/e9444f3c
      - https://doh.luluky.com/dns-query/e9444f3c
    "+.ydlingshi.com":
      - https://doh.lalakw.com:2096/dns-query/e9444f3c
      - https://doh.luluky.com/dns-query/e9444f3c
    "+.gttysd.com":
      - https://doh.lalakw.com:2096/dns-query/e9444f3c
      - https://doh.luluky.com/dns-query/e9444f3c
  # 命中规则为 DIRECT（直连）的域名，用这组 DNS 解析
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 按域名集合指定解析服务器：国内走国内 DoH，国外走代理出去的 8.8.8.8
  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,microsoftcn_domain,applecn_domain":
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter_!cn":
      - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  # 默认解析服务器
  nameserver:
    - https://8.8.8.8/dns-query#默认代理&ecs=223.5.5.0/24
  # 备用解析服务器
  fallback:
    - https://8.8.8.8/dns-query#默认代理
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - "rule-set:fakeipfilter_cn"
    - "rule-set:fakeipfilter_!cn"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "rule-set:microsoftcn_domain"
    - "rule-set:applecn_domain"

# 公共常量
x-common-proxies: &common-proxies [默认代理, 家宽落地, 狮城自动, 日本自动, 香港自动, 台湾自动, 美国自动, 狮城手动, 日本手动, 香港手动, 台湾手动, 美国手动, 全部节点 ,自动选择, XFLASH自动, 白嫖云自动, 良心云自动, 大哥云自动, 故障转移, 直连]
x-node-exclude: &node-exclude '(?i)(剩余|流量|官网|套餐|订阅|到期|过期|Expire|Traffic|Reset|Game|游戏|家宽|倍率|[0-9]+(\.[0-9]+)?x|[0-9]+(\.[0-9]+)?倍)'

# 地区节点筛选（和上面的 node-exclude 配合使用）
x-hk-filter: &HK "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"
x-jp-filter: &JP "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"
x-tw-filter: &TW "(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$"
x-sg-filter: &SG "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$"
x-us-filter: &US "(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$"

